name: Bug 报告
description: 功能异常、崩溃、安装失败或风扇行为不对
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。发之前请先确认两件事：

        1. 你用的是 **最新 Release**（[Releases](https://github.com/lovexiaov/funfan/releases)）；
        2. 如果是首次启动被 macOS 拦住、提示「已损坏，无法打开」——那是**未公证包的预期行为**，先看 [安装说明](https://github.com/lovexiaov/funfan#安装)，不用开 issue。

        贴日志前请删掉用户名、序列号等个人信息。诊断报告只在本机生成，不会自动上传。

  - type: checkboxes
    id: precheck
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 issue，没找到相同问题
          required: true
        - label: 我已阅读安装文档（docs/INSTALL.md）与常见问题（docs/RELEASE.md）
          required: true

  - type: dropdown
    id: install-method
    attributes:
      label: 安装方式
      options:
        - 下载 DMG / ZIP（adhoc 签名，手动放行）
        - 从源码构建（make app）
        - 其他
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: FunFan 版本
      description: 设置窗口底部可见；源码构建请贴 `git rev-parse --short HEAD`
      placeholder: 1.0.0-alpha.3
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 机型 / 芯片 / 系统
      placeholder: Mac mini (M4, 2024) · macOS 15.3
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 FunFan，切到「规则」
        2. 新建规则「CPU ≥ 60℃ → 3500 RPM」
        3. 等 2 分钟…
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 有截图/录屏直接拖进来
    validations:
      required: true

  - type: textarea
    id: diagnose
    attributes:
      label: 诊断报告
      description: |
        设置 → 诊断 → 完整诊断报告 → 复制。
        或终端执行 `make diagnose`（只读，不需要 root）。
      render: markdown
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 相关日志（可选）
      description: 后台组件日志在 `/var/log/cn.lovexiaov.fun.fan.helper.log`
      render: shell
    validations:
      required: false
