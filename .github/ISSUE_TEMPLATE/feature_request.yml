name: 功能建议
description: 想要新能力，或觉得现有行为可以更好
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提之前建议先看一眼 [`docs/SPEC-FunFan.md`](https://github.com/lovexiaov/funfan/blob/main/docs/SPEC-FunFan.md) 的「不做的事」——有些方向是明确排除的（比如 App Store 上架、Intel Mac 支持）。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 先描述场景和痛点，不必直接给方案
      placeholder: 我在跑长时间编译时，希望……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的做法
      description: 有具体交互/规则写法更好
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 试过的替代方案
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      multiple: true
      options:
        - 温度 / 电量监控
        - 风扇控制（固定 / 曲线 / 规则）
        - 菜单栏与界面
        - 特权 helper / 安装
        - 打包与发布
        - 命令行 / 诊断
        - 文档
    validations:
      required: true

  - type: checkboxes
    id: willingness
    attributes:
      label: 你愿意自己实现吗
      options:
        - label: 愿意提 PR（请先看 CONTRIBUTING，安全红线部分尤其重要）
          required: false
