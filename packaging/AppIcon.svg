<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="ff-title ff-desc" id="funfan-icon">
  <title id="ff-title">FunFan 应用图标</title>
  <desc id="ff-desc">浅银色圆角方形底板上的一台正视角五叶风扇，蓝钢色扇叶与深灰轮毂。</desc>

  <defs>
    <!-- 底板：自上而下的浅银渐变 -->
    <linearGradient id="ff-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#DFE5EC"/>
    </linearGradient>

    <!-- 扇叶：蓝钢渐变（本图唯一强调色） -->
    <linearGradient id="ff-blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B9BD5"/>
      <stop offset="1" stop-color="#2E6DA4"/>
    </linearGradient>

    <!-- 轮毂：深灰 -->
    <linearGradient id="ff-hub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A6675"/>
      <stop offset="1" stop-color="#333D4B"/>
    </linearGradient>

    <!-- 底板投影 -->
    <filter id="ff-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#1A2430" flood-opacity="0.22"/>
    </filter>

    <!-- 顶部内高光：向下渐隐，避免生硬接缝 -->
    <linearGradient id="ff-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <g id="ff-blade-shape">
      <path d="M 0 -58
               C 60 -78, 92 -184, 56 -252
               C 38 -284, 16 -290, 0 -290
               C -16 -290, -38 -284, -56 -252
               C -92 -184, -60 -78, 0 -58 Z"
            fill="url(#ff-blade)" stroke="#1F4E79" stroke-opacity="0.25" stroke-width="4"/>
    </g>
  </defs>

  <!-- 圆角方形底板（macOS squircle 近似） -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#ff-bg)" filter="url(#ff-shadow)"/>
  <!-- 顶部内高光：渐隐，无接缝 -->
  <rect x="100" y="100" width="824" height="360" rx="185" fill="url(#ff-glass)"/>

  <!-- 风扇组 -->
  <g>
    <!-- 护罩外环 -->
    <circle cx="512" cy="512" r="322" fill="none" stroke="#C3CDD8" stroke-width="12"/>
    <!-- 护罩内凹底 -->
    <circle cx="512" cy="512" r="304" fill="#EDF1F5" stroke="#C3CDD8" stroke-width="3"/>

    <!-- 五片扇叶，72° 均布 -->
    <use href="#ff-blade-shape"/>
    <use href="#ff-blade-shape" transform="rotate(72 512 512)"/>
    <use href="#ff-blade-shape" transform="rotate(144 512 512)"/>
    <use href="#ff-blade-shape" transform="rotate(216 512 512)"/>
    <use href="#ff-blade-shape" transform="rotate(288 512 512)"/>

    <!-- 轮毂（三圈同心） -->
    <circle cx="512" cy="512" r="80" fill="url(#ff-hub)"/>
    <circle cx="512" cy="512" r="36" fill="#8494A6"/>
    <circle cx="512" cy="512" r="20" fill="#A8B6C4"/>
  </g>
</svg>
